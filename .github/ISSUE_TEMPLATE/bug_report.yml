name: Bug report
description: Something in Phoenix Controls isn't working the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please make sure you're on the **latest release**
        first — older builds don't get fixes.
  - type: dropdown
    id: app
    attributes:
      label: Which app?
      description: Where does the problem show up?
      options:
        - Hub
        - Architect
        - Visualist
        - Installer / updater
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: When I do X, Y happens. I expected Z.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger it.
      placeholder: |
        1. Open Hub
        2. ...
        3. See the error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Phoenix Controls version
      description: Shown in the Hub title bar / About dialog (e.g. v0.12.260608-p1).
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Anything relevant from Hub's System Log panel. Redact tokens first.
      render: text
    validations:
      required: false
